<div class="about-container">
  <div class="glass-card">
    <div class="card-header">
      <mat-icon class="logo-icon">rocket_launch</mat-icon>
      <h1 class="title">About <span class="highlight">GitRepos</span></h1>
    </div>
    
    <div class="card-body">
      <p class="description">
        GitRepos surfaces the most popular repositories trending on GitHub across
        JavaScript, TypeScript, Python, Go, and Shell - updated daily, weekly, and monthly.
      </p>

      <div class="data-source">
        <mat-icon class="source-icon">dataset</mat-icon>
        <p>
          Data is sourced from
          <a href="https://github.com/Hyraze/trending-collection" target="_blank" rel="noopener">
            Hyraze/trending-collection
          </a>
          JSON API.
        </p>
      </div>
    </div>
    
    <div class="card-footer">
      <a class="github-btn" href="https://github.com/Hyraze/gitrepos" target="_blank" rel="noopener">
        <mat-icon>open_in_new</mat-icon>
        <span>View Source on GitHub</span>
      </a>
    </div>
  </div>
</div>
