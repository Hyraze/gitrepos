<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over" position="end" [(opened)]="sidenavOpen" class="sidenav">
    <mat-nav-list>
      @for (link of navLinks; track link.path) {
        <a mat-list-item
           [routerLink]="link.path"
           routerLinkActive="active-link"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="toggleSidenav()">
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="app-toolbar" color="primary">
      <a class="brand" routerLink="/">
        <span class="brand-icon">◈</span>
        <span class="brand-name">GitRepos</span>
      </a>
      <span class="spacer"></span>
      <nav class="desktop-nav">
        @for (link of navLinks; track link.path) {
          <a mat-button
             [routerLink]="link.path"
             routerLinkActive="active-nav"
             [routerLinkActiveOptions]="{ exact: true }">
            {{ link.label }}
          </a>
        }
      </nav>
      <button mat-icon-button class="mobile-menu-btn" (click)="toggleSidenav()" aria-label="Menu">
        <mat-icon>menu</mat-icon>
      </button>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>

    <footer class="app-footer">
      <span>Made with <mat-icon class="heart-icon" inline>favorite</mat-icon> by Hyraze</span>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
